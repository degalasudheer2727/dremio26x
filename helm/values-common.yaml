# =============================================================================
# Dremio 26 (v3 chart) — COMMON overrides (shared by dev / qa / prod)
# =============================================================================
# Layered AFTER values-openshift-overrides.yaml and BEFORE the per-env file:
#
#   helm upgrade --install dremio oci://quay.io/dremio/dremio-helm \
#     --version 3.2.3 \
#     -f helm/values-openshift-overrides.yaml \
#     -f helm/values-common.yaml \
#     -f helm/values-<env>.yaml --wait
#
# NOTE ON VERSIONS: the Helm CHART version is semver 3.x.x (e.g. 3.2.3); the
# Dremio APP/image version is 26.x.x (e.g. 26.1.3). Do not confuse the two.
# =============================================================================

# Enterprise image is the chart default (quay.io/dremio/dremio-enterprise).
# Pull it with a Quay pull secret created per the install guide.
imagePullSecrets:
  - name: dremio-pull-secret

dremio:
  # Paste your Enterprise license key, or load it from a Secret via --set-file.
  license: ""
  image:
    repository: quay.io/dremio/dremio-enterprise
    tag: "26.1.3"            # APP version — verify against your chart version
    pullPolicy: IfNotPresent

# Kubernetes service DNS suffix. Leave as cluster.local unless your OpenShift
# cluster uses a custom domain.
cluster:
  domain: cluster.local

# The chart default service type is LoadBalancer. On OpenShift we expose the UI
# via a Route (openshift/03-route-ui.yaml), so use ClusterIP and avoid
# provisioning a cloud load balancer (which often stays <pending> on-prem).
service:
  type: ClusterIP

# The v3 chart REQUIRES object storage for distStorage — there is no "local"
# option. Each environment sets its own bucket/credentials (see values-<env>.yaml).
