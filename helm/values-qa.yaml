# =============================================================================
# Dremio 26 - QA / PRE-PROD overlay  (layer ON TOP of values-common.yaml)
# =============================================================================
# Goal: a faithful, smaller-scale MIRROR of production so you validate the exact
# artifact you will ship. QA therefore uses the SAME edition, the SAME storage
# class of backend (object storage), QUORUM ZooKeeper, TLS, and anti-affinity as
# prod — only the resource sizes and replica counts are reduced.
#
# Install:
#   ENV=qa make install               # or:
#   helm upgrade --install dremio oci://quay.io/dremio/dremio-helm \
#     --version 26.0.0 -n dremio-qa \
#     -f helm/values-common.yaml -f helm/values-qa.yaml
#
# PREREQS for QA (same shape as prod):
#   * Enterprise pull secret (see install guide Step 5) OR switch to OSS image.
#   * An object-storage bucket/container for distStorage (S3/ADLS/GCS).
#   * Credentials stored in a Kubernetes Secret, referenced by name (never inline).
# =============================================================================

# Match prod's edition so QA tests the real thing. Comment this out and use the
# dev OSS image only if you have no Enterprise license.
image:
  registry: quay.io
  repository: dremio/dremio-enterprise
  tag: "26.0.0"
  pullSecrets:
    - dremio-pull-secret

# --- Coordinator: mid-size, single master -----------------------------------
coordinator:
  cpu: 4
  memory: 16384            # MiB (16 Gi)
  count: 0
  volumeSize: 100Gi
  web:
    tls:
      enabled: true        # end-to-end TLS, like prod (Route = reencrypt)
  client:
    tls:
      enabled: true
  flight:
    tls:
      enabled: true

# --- Executors: 2 nodes, cloud cache on (smaller than prod) ------------------
executor:
  cpu: 8
  memory: 32768            # MiB (32 Gi)
  count: 2
  volumeSize: 100Gi
  cloudCache:
    enabled: true
    volumeSize: 50Gi
  # Spread executors across nodes (soft) so a single node loss is tolerable.
  antiAffinity: "soft"

# --- ZooKeeper: 3-node QUORUM (matches prod topology) ------------------------
zookeeper:
  image: zookeeper:3.8.4-jre-17
  count: 3
  cpu: 0.5
  memory: 2048
  volumeSize: 16Gi

# --- Distributed storage: OBJECT STORAGE (mirror prod; not local PVC) --------
# Example uses AWS S3. Replace with azure/azureStorage/gcp as appropriate.
# Prefer IAM/workload identity ("metadata") over inline keys; if you must use
# keys, put them in a Secret and reference it rather than committing them here.
distStorage:
  type: "aws"
  aws:
    bucketName: "dremio-qa-dist"
    path: "/"
    authentication: "metadata"        # IAM role / IRSA; avoids inline keys
    # authentication: "accessKeySecret"
    # credentials:
    #   secretName: "dremio-qa-s3-creds"   # keys live in this Secret

# Use a known good StorageClass for the metadata/scratch PVCs.
storageClass: ""        # set explicitly if QA has no default class
