# -----------------------------------------------------------------------------
# Argo CD AppProject — scopes what the Dremio applications may deploy
# -----------------------------------------------------------------------------
# Restricts source repos and destination namespaces, and whitelists the
# cluster-scoped resources the v3 chart + operators need (CRDs, the Node Tuning
# Tuned CR). Apply into the Argo CD / OpenShift GitOps namespace (openshift-gitops).
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dremio
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Dremio 26 (v3 chart) — dev/qa/prod
  sourceRepos:
    # This git repo (values + manifests) and the Dremio OCI chart registry.
    - https://github.com/degalasudheer2727/dremio26x.git
    - oci://quay.io/dremio/dremio-helm
    - quay.io/dremio/dremio-helm
  destinations:
    - { server: https://kubernetes.default.svc, namespace: dremio-dev }
    - { server: https://kubernetes.default.svc, namespace: dremio-qa }
    - { server: https://kubernetes.default.svc, namespace: dremio-prod }
    - { server: https://kubernetes.default.svc, namespace: openshift-cluster-node-tuning-operator }
  # The chart's useOpenShiftRoles creates namespaced RoleBindings; operators add
  # CRDs (cluster-scoped). Allow the cluster-scoped kinds we expect.
  clusterResourceWhitelist:
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: tuned.openshift.io, kind: Tuned }
    - { group: "", kind: Namespace }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
