# -----------------------------------------------------------------------------
# Dremio 26 on OpenShift - RBAC binding for the custom SCC
# -----------------------------------------------------------------------------
# This binds the "dremio-scc" SecurityContextConstraint (03-scc.yaml) to the
# "dremio" ServiceAccount using RBAC. This is the declarative equivalent of:
#
#   oc adm policy add-scc-to-user dremio-scc -z dremio -n dremio
#
# Using RBAC (instead of editing the SCC's `users:` list) is the GitOps-friendly
# way to grant SCC access and is what `oc adm policy` does under the hood.
#
# Apply with (as cluster-admin):
#   oc apply -f openshift/04-rbac.yaml
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dremio-use-scc
  namespace: dremio
  labels:
    app.kubernetes.io/part-of: dremio
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - dremio-scc
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dremio-use-scc
  namespace: dremio
  labels:
    app.kubernetes.io/part-of: dremio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dremio-use-scc
subjects:
  - kind: ServiceAccount
    name: dremio
    namespace: dremio
