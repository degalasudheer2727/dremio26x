# -----------------------------------------------------------------------------
# Dremio 26 on OpenShift - ServiceAccount
# -----------------------------------------------------------------------------
# OpenShift assigns each pod a RANDOM, arbitrary UID from the namespace range by
# default (restricted-v2 SCC). Dremio's pods (coordinator, executor, zookeeper)
# must all run as the SAME, KNOWN user so that the data they write to the shared
# persistent volumes stays readable across restarts and across components.
#
# We create a dedicated ServiceAccount and (in 03-scc.yaml) grant it a custom
# Security Context Constraint that pins a fixed UID/GID.
#
# Apply with:
#   oc apply -f openshift/02-serviceaccount.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dremio
  namespace: dremio
  labels:
    app.kubernetes.io/part-of: dremio
