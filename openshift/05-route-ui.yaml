# -----------------------------------------------------------------------------
# Dremio 26 on OpenShift - Route for the Web UI (port 9047)
# -----------------------------------------------------------------------------
# OpenShift uses "Route" objects instead of Kubernetes Ingress to expose
# services on a public hostname. This Route exposes the Dremio web UI.
#
# IMPORTANT: the `to.name` below must match the name of the Service that the
# Helm chart creates for the coordinator/client. After `helm install`, run:
#     oc get svc -n dremio
# and confirm the client service name. With the v3 chart the client service is
# typically named "dremio-client". Adjust `to.name` if yours differs.
#
# This Route terminates TLS at the OpenShift router (edge) and redirects HTTP
# to HTTPS. Dremio inside the cluster keeps speaking plain HTTP on 9047, which
# keeps the minimal setup simple. For end-to-end TLS, switch to passthrough/
# reencrypt and enable TLS in the Helm values (see helm/values-openshift-minimal.yaml).
#
# Apply with:
#   oc apply -f openshift/05-route-ui.yaml
#
# Then get the URL with:
#   oc get route dremio-ui -n dremio -o jsonpath='{.spec.host}{"\n"}'
# -----------------------------------------------------------------------------
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dremio-ui
  namespace: dremio
  labels:
    app.kubernetes.io/part-of: dremio
spec:
  to:
    kind: Service
    name: dremio-client
    weight: 100
  port:
    targetPort: web        # named port on the client service (9047)
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
